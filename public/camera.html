<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HomeCam Node - Smartphone Camera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #090a0f;
      color: #e2e8f0;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }
    
    /* Fullscreen Video Background */
    #videoContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    /* Diagnostics Canvas Overlay */
    #motionCanvas {
      display: none;
    }

    /* UI Overlay Panel */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.75) 0%, rgba(0,0,0,0) 40%, rgba(15, 23, 42, 0.85) 100%);
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .overlay * {
      pointer-events: auto;
    }
    
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
    }
    .status-dot.online {
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    .targets-list {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .target-tag {
      font-size: 0.75rem;
      background: rgba(99, 102, 241, 0.25);
      color: #a5b4fc;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(99, 102, 241, 0.4);
    }
    .target-tag.recording {
      background: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.6);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.7; }
      to { opacity: 1; }
    }

    .bottom-bar {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .controls-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 14px;
      border-radius: 14px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn-stealth {
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      border: none;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
    }

    /* Stealth Blackout Screen Overlay */
    #stealthOverlay {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #stealthOverlay.active {
      display: flex;
    }
    .stealth-indicator {
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50%;
    }
    .stealth-tip {
      position: absolute;
      bottom: 30px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.25);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Setup Config Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(9, 10, 15, 0.9);
      backdrop-filter: blur(15px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .modal-card h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .form-control {
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
    }
    .form-control:focus {
      border-color: #6366f1;
    }
  </style>

  <!-- TensorFlow.js & Socket.IO Client -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
</head>
<body>

  <!-- Video Stream Canvas Container -->
  <div id="videoContainer">
    <video id="cameraVideo" autoplay playsinline muted></video>
    <canvas id="motionCanvas" width="64" height="64"></canvas>
  </div>

  <!-- Regular UI Overlay -->
  <div class="overlay" id="uiOverlay">
    <div class="top-bar">
      <div>
        <div class="badge">
          <div class="status-dot" id="statusDot"></div>
          <span id="camNameLabel">Camera Node</span>
        </div>
        <div class="targets-list" id="activeTargetsList">
          <span class="target-tag">🐱 Cat</span>
          <span class="target-tag">👤 Human</span>
          <span class="target-tag">🏃 Motion</span>
        </div>
      </div>
      <div>
        <div class="badge" id="batteryBadge">⚡ 100%</div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="controls-row">
        <button class="btn btn-stealth" id="btnStealth">
          🌙 Dim Screen
        </button>
        <button class="btn" id="btnPauseRecord">
          🔴 Recording ON
        </button>
        <button class="btn" id="btnTorchLocal">
          💡 Torch
        </button>
        <button class="btn" id="btnFlipCam">
          🔄 Switch
        </button>
        <button class="btn" id="btnSettings">
          ⚙️ Setup
        </button>
      </div>
    </div>
  </div>

  <!-- Stealth Blackout Overlay (OLED Energy Saver / Room Dimmer) -->
  <div id="stealthOverlay">
    <div class="stealth-indicator"></div>
    <div class="stealth-tip">Tap Screen to Wake Display</div>
  </div>

  <!-- Camera Setup Modal -->
  <div class="modal" id="setupModal">
    <div class="modal-card">
      <h2>📷 Camera Setup</h2>
      <div class="form-group">
        <label for="inputCamId">Camera ID / Name</label>
        <input type="text" id="inputCamId" class="form-control" value="Living Room Phone" placeholder="e.g. Living Room">
      </div>
      <div class="form-group">
        <label for="selectFacing">Camera Lens Mode</label>
        <select id="selectFacing" class="form-control">
          <option value="environment" selected>Rear Camera (Environment - Supports Flashlight)</option>
          <option value="user">Front Camera (Selfie)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="selectDevice">Specific Physical Lens (Ultra-Wide / Main / Telephoto Zoom)</label>
        <select id="selectDevice" class="form-control">
          <option value="">Auto-detecting Lenses...</option>
        </select>
      </div>
      <div class="form-group">
        <label for="selectRes">Resolution</label>
        <select id="selectRes" class="form-control">
          <option value="720p" selected>720p HD (Balanced)</option>
          <option value="1080p">1080p Full HD (High Quality)</option>
          <option value="480p">480p SD (Low Bandwidth)</option>
        </select>
      </div>
      <button class="btn btn-stealth" id="btnSaveSetup" style="justify-content: center; margin-top: 10px;">
        🚀 Start Security Camera Node
      </button>
    </div>
  </div>

  <script src="/camera.js"></script>
</body>
</html>
